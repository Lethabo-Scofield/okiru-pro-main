<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Okiru ESG Toolkit — SG Consumer FY2025/26</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080e14;
  --bg2:#0d1520;
  --glass:rgba(255,255,255,0.04);
  --glass-hover:rgba(255,255,255,0.07);
  --glass-border:rgba(255,255,255,0.09);
  --glass-border-hover:rgba(255,255,255,0.18);
  --glass-strong:rgba(255,255,255,0.10);
  --text:#f0ede8;
  --text2:#8a9aaa;
  --text3:#4a5a6a;
  --acc-e:#1de9a0;
  --acc-s:#f5a623;
  --acc-g:#9b6bff;
  --acc-red:#ff5f5f;
  --acc-blue:#4aa8ff;
  --nav-w:220px;
  --hdr-h:52px;
}

/* ── BASE ── */
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;background-image:radial-gradient(ellipse 80% 60% at 20% -10%,rgba(29,233,160,0.06) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 100%,rgba(155,107,255,0.07) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 50% 50%,rgba(245,166,35,0.03) 0%,transparent 70%)}
::selection{background:rgba(29,233,160,0.25);color:#fff}

/* ── GLASS MIXIN UTILITY ── */
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:14px}
.glass-sm{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:10px}
.glass-strong{background:var(--glass-strong);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,0.14);border-radius:14px}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:300;height:var(--hdr-h);background:rgba(8,14,20,0.75);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;padding:0 20px;gap:14px}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-brand{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.hdr-brand span{color:var(--acc-e)}
.hdr-sub{font-size:10px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase}
.hdr-pill{font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--text2)}
.hdr-sp{flex:1}
.hdr-score{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hdr-rat{font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid;margin-left:6px}
.stance-row{display:flex;gap:3px;margin-left:10px}
.sb{font-size:10px;font-weight:500;padding:4px 10px;border:1px solid var(--glass-border);border-radius:20px;background:transparent;cursor:pointer;color:var(--text3);transition:all .2s;letter-spacing:.02em}
.sb:hover{border-color:var(--glass-border-hover);color:var(--text2)}
.sb.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--text);font-weight:600}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - var(--hdr-h));overflow:hidden}

/* ── LEFT NAV ── */
.nav{width:var(--nav-w);background:rgba(8,14,20,0.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-right:1px solid var(--glass-border);overflow-y:auto;flex-shrink:0;padding:12px 0 24px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ns{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;padding:16px 16px 6px}
.pillar-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border:none;background:none;color:var(--text2);font-size:12px;width:100%;text-align:left;border-left:2px solid transparent;transition:all .18s;font-weight:500;letter-spacing:-.01em}
.pillar-btn:hover{color:var(--text);background:rgba(255,255,255,.03)}
.pillar-btn.on{color:var(--text);border-left-color:var(--acc-e);background:rgba(29,233,160,.06)}
.pillar-btn.on.s-pil{border-left-color:var(--acc-s);background:rgba(245,166,35,.06)}
.pillar-btn.on.g-pil{border-left-color:var(--acc-g);background:rgba(155,107,255,.06)}
.picon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.pscore{margin-left:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;border:1px solid;font-variant-numeric:tabular-nums}
.sub-btn{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 32px;cursor:pointer;border:none;background:none;color:var(--text3);font-size:11px;width:100%;text-align:left;border-left:2px solid transparent;transition:all .18s;letter-spacing:-.01em}
.sub-btn:hover{color:var(--text2);background:rgba(255,255,255,.02)}
.sub-btn.on{color:var(--text);background:rgba(255,255,255,.04)}
.sub-btn .sbpts{margin-left:auto;font-size:9px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.6}
.sub-btn.on .sbpts{opacity:1}
.ndiv{height:1px;background:var(--glass-border);margin:8px 12px}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:28px 28px 40px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* ── PAGE ELEMENTS ── */
.page-hdr{margin-bottom:20px}
.page-eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.page-hdr h2{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--text)}
.page-hdr p{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.acc-e{color:var(--acc-e)}.acc-s{color:var(--acc-s)}.acc-g{color:var(--acc-g)}.acc-r{color:var(--acc-red)}

/* SCORE HERO */
.score-hero{padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px}
.sh-big{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;min-width:100px}
.sh-right{flex:1}
.sh-rat{font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid;display:inline-block;margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.sh-label{font-size:13px;color:var(--text2);margin-bottom:3px;font-weight:500}
.sh-desc{font-size:11px;color:var(--text3);line-height:1.5}
.sh-bar-track{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:10px}
.sh-bar-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{padding:14px 16px}
.kpi .kl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.kpi .kv{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .ks{font-size:10px;color:var(--text3);margin-top:3px}
.kpi .kb{height:2px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:10px;overflow:hidden}
.kpi .kbf{height:100%;border-radius:2px;transition:width .5s}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}

/* CARD */
.card{padding:18px 20px;margin-bottom:12px}
.card-ttl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-ttl .ct-badge{margin-left:auto;font-size:9px;font-weight:600;padding:2px 7px;border-radius:8px;border:1px solid}

/* BAR ROWS */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:130px;color:var(--text2);flex-shrink:0;cursor:pointer;transition:color .15s}
.bar-lbl:hover{color:var(--acc-e)}
.bar-track{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .5s}
.bar-val{width:70px;text-align:right;font-weight:600;flex-shrink:0;font-size:11px;font-variant-numeric:tabular-nums}

/* INDICATOR TABLE */
.ind-tbl{width:100%;border-collapse:collapse}
.ind-tbl th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--glass-border)}
.ind-tbl td{font-size:12px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;transition:background .15s}
.ind-tbl tr:hover td{background:rgba(255,255,255,.02)}
.ind-tbl tr:last-child td{border-bottom:none}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:7px;flex-shrink:0;vertical-align:middle}
.pbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);width:50px;display:inline-block;overflow:hidden;vertical-align:middle}
.pbarf{height:100%;border-radius:2px}

/* INPUT TABLE */
.inp-tbl{width:100%;border-collapse:collapse}
.inp-tbl th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 10px;border-bottom:1px solid var(--glass-border);text-align:left}
.inp-tbl td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;font-size:12px}
.inp-tbl tr:hover td{background:rgba(255,255,255,.02)}
.inp-tbl tr:last-child td{border-bottom:none}
.inp-tbl .lc{font-weight:500;color:var(--text2);white-space:nowrap;width:180px}
.inp-tbl .nc{font-size:11px;color:var(--text3)}
.inp-tbl .ac{font-weight:600;font-variant-numeric:tabular-nums}
.inp-tbl .sc-row td{background:rgba(255,255,255,.03);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:5px 10px}
.inp-tbl input[type=number],.inp-tbl select{font-size:12px;padding:5px 8px;border:1px solid var(--glass-border);border-radius:7px;background:rgba(255,255,255,.05);color:var(--text);width:100%;transition:border-color .2s}
.inp-tbl input:focus,.inp-tbl select:focus{border-color:rgba(29,233,160,.4);outline:none;background:rgba(29,233,160,.04)}
.inp-tbl select option{background:#0d1520;color:var(--text)}

/* EEA2 TABLE */
.eea-wrap{overflow-x:auto}
.eea-tbl{border-collapse:collapse;width:100%;font-size:11px}
.eea-tbl th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:center;padding:6px 5px;border-bottom:1px solid var(--glass-border);white-space:nowrap}
.eea-tbl th.tl{text-align:left;padding-left:8px}
.eea-tbl td{padding:4px 4px;border-bottom:1px solid rgba(255,255,255,.03);text-align:center}
.eea-tbl td.tl{text-align:left;padding-left:8px;font-weight:500;color:var(--text2)}
.eea-tbl .eap-r td{font-size:10px;color:var(--text3);font-style:italic}
.eea-tbl tr:hover td{background:rgba(255,255,255,.02)}
.ni{width:40px;font-size:11px;padding:3px 4px;border:1px solid var(--glass-border);border-radius:5px;background:rgba(255,255,255,.05);color:var(--text);text-align:center;transition:border-color .2s}
.ni:focus{border-color:rgba(29,233,160,.4);outline:none;background:rgba(29,233,160,.04)}

/* ACTION ITEMS */
.act{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:7px;border:1px solid;transition:all .2s}
.act:last-child{margin-bottom:0}
.act:hover{background:rgba(255,255,255,.02)}
.act-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.act-body{flex:1}
.act-title{font-weight:500;font-size:12px;color:var(--text)}
.act-desc{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.act-pts{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.act-high{background:rgba(255,95,95,.06);border-color:rgba(255,95,95,.15)}
.act-amb{background:rgba(245,166,35,.05);border-color:rgba(245,166,35,.12)}
.act-good{background:rgba(29,233,160,.04);border-color:rgba(29,233,160,.12)}

/* KING V TABLE */
.kv-tbl{width:100%;border-collapse:collapse}
.kv-tbl th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:6px 10px;border-bottom:1px solid var(--glass-border);text-align:left}
.kv-tbl td{font-size:12px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.kv-tbl tr:hover td{background:rgba(255,255,255,.02)}
.kv-pill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;border:1px solid;letter-spacing:.04em;white-space:nowrap}

/* CHIP */
.chip{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;border:1px solid;letter-spacing:.04em;text-transform:uppercase;display:inline-block}
.chip-e{color:var(--acc-e);border-color:rgba(29,233,160,.3);background:rgba(29,233,160,.08)}
.chip-a{color:var(--acc-s);border-color:rgba(245,166,35,.3);background:rgba(245,166,35,.08)}
.chip-r{color:var(--acc-red);border-color:rgba(255,95,95,.3);background:rgba(255,95,95,.08)}
.chip-g{color:var(--acc-g);border-color:rgba(155,107,255,.3);background:rgba(155,107,255,.08)}

/* B-BBEE */
.bbee-tbl{width:100%;border-collapse:collapse}
.bbee-tbl th,.bbee-tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.bbee-tbl th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:left}
.lvl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.lvl-cell{padding:10px 8px;border-radius:10px;border:1px solid var(--glass-border);text-align:center;background:var(--glass);cursor:default;transition:all .2s}
.lvl-cell .lv-n{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.lvl-cell .lv-p{font-size:16px;font-weight:700;color:var(--text);margin:3px 0}
.lvl-cell .lv-r{font-size:10px;color:var(--text3)}
.lvl-cell.active{background:rgba(29,233,160,.12);border-color:rgba(29,233,160,.35)}
.lvl-cell.active .lv-n,.lvl-cell.active .lv-r,.lvl-cell.active .lv-p{color:var(--acc-e)}

/* BREADCRUMB */
.breadcrumb{font-size:11px;color:var(--text3);margin-bottom:16px;display:flex;align-items:center;gap:5px;letter-spacing:.01em}
.breadcrumb a{color:var(--acc-e);cursor:pointer;opacity:.7;transition:opacity .15s}
.breadcrumb a:hover{opacity:1}

/* SCROLLBAR */
.card::-webkit-scrollbar{width:3px}

/* RISK ROW */
.risk-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.risk-row:last-child{border-bottom:none}

/* SETTINGS ROW */
.settings-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.settings-row label{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.settings-row select{font-size:11px;padding:4px 8px;border:1px solid var(--glass-border);border-radius:8px;background:rgba(255,255,255,.07);color:var(--text);transition:border-color .2s}
.settings-row select:focus{border-color:rgba(29,233,160,.4);outline:none}
.settings-row select option{background:#0d1520}
.settings-row .eap-note{font-size:11px;color:var(--text3);margin-left:auto}

@media(max-width:720px){.nav{display:none}.kpi-row{grid-template-columns:1fr 1fr}.two-col,.three-col{grid-template-columns:1fr}}

/* PRIOR PERIOD PANEL */
.pp-btn{position:fixed;bottom:20px;right:20px;z-index:500;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--glass-border);color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;backdrop-filter:blur(20px);transition:all .2s}
.pp-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:var(--text)}
.pp-panel{position:fixed;bottom:56px;right:20px;z-index:500;width:320px;max-height:60vh;overflow-y:auto;border-radius:12px;background:rgba(13,21,32,0.92);border:1px solid var(--glass-border);backdrop-filter:blur(30px);padding:16px;display:none;scrollbar-width:thin}
.pp-panel.open{display:block}
.pp-panel h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.pp-panel .pf{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:8px}
.pp-panel .pf label{font-size:11px;color:var(--text2);flex:1}
.pp-panel .pf input{width:80px;font-size:11px;padding:3px 6px;border:1px solid var(--glass-border);border-radius:5px;background:rgba(255,255,255,.06);color:var(--text);text-align:right}
.pp-panel .pf input:focus{border-color:rgba(29,233,160,.4);outline:none}
.pp-panel .pp-note{font-size:10px;color:var(--text3);margin-bottom:10px;line-height:1.4}

/* ── IMPORT TAB ── */
.imp-section{margin-bottom:20px}
.imp-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--glass-border)}
.imp-section-hdr h3{font-size:13px;font-weight:600;letter-spacing:-.01em}
.imp-section-hdr p{font-size:11px;color:var(--text3);margin-top:2px}
.imp-tpl-btn{font-size:10px;font-weight:600;padding:4px 12px;border:1px solid var(--glass-border);border-radius:8px;background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;transition:all .18s;letter-spacing:.04em;text-transform:uppercase}
.imp-tpl-btn:hover{border-color:var(--acc-blue);color:var(--acc-blue)}
.imp-tpl-btn.copied{border-color:var(--acc-e);color:var(--acc-e)}
.imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.imp-field{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:12px 14px;transition:border-color .2s}
.imp-field:hover{border-color:var(--glass-border-hover)}
.imp-field.has-data{border-color:rgba(29,233,160,.25);background:rgba(29,233,160,.04)}
.imp-field.has-error{border-color:rgba(255,95,95,.3);background:rgba(255,95,95,.04)}
.imp-field-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.imp-field-name{font-size:11px;font-weight:600;color:var(--text2)}
.imp-field-unit{font-size:10px;color:var(--text3);padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border)}
.imp-field-status{font-size:10px;font-weight:600}
.imp-periods{display:grid;gap:3px}
.imp-period-row{display:flex;align-items:center;gap:6px;font-size:11px}
.imp-period-lbl{width:40px;color:var(--text3);flex-shrink:0;font-variant-numeric:tabular-nums}
.imp-period-inp{flex:1;font-size:11px;padding:3px 6px;border:1px solid var(--glass-border);border-radius:5px;background:rgba(255,255,255,.04);color:var(--text);text-align:right;min-width:0;transition:border-color .2s;font-variant-numeric:tabular-nums}
.imp-period-inp:focus{border-color:rgba(74,168,255,.5);outline:none;background:rgba(74,168,255,.05)}
.imp-period-inp.populated{border-color:rgba(29,233,160,.3);background:rgba(29,233,160,.04)}
.imp-ytd{font-size:11px;font-weight:700;color:var(--acc-e);text-align:right;min-width:60px;font-variant-numeric:tabular-nums}
.imp-ytd-lbl{width:40px;font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.paste-drop{border:1.5px dashed var(--glass-border);border-radius:10px;padding:14px;margin-bottom:10px;transition:all .2s;background:rgba(255,255,255,.02)}
.paste-drop.drag-over{border-color:var(--acc-blue);background:rgba(74,168,255,.06)}
.paste-drop-lbl{font-size:11px;color:var(--text3);text-align:center;margin-bottom:8px}
.paste-drop-lbl span{color:var(--acc-blue)}

  brdT:null,kvT:null,ifrsT:null,garpT:null,ethT:null,mc_pts:null
};
function trendArrow(cur,prior,lowerBetter){
  if(prior===null||prior===undefined||cur===null||cur===undefined)return'<span style="color:var(--text3);font-size:10px;font-weight:500">—</span>';
  const diff=cur-prior;
  if(Math.abs(diff)<0.001)return'<span style="color:var(--text3);font-size:10px">→</span>';
  const pctChg=prior!==0?Math.round(Math.abs(diff)/Math.abs(prior)*100):0;
  const up=diff>0;const good=lowerBetter?!up:up;
  const c=good?'var(--acc-e)':'var(--acc-red)';
  return`<span style="color:${c};font-size:10px;font-weight:600">${up?'↑':'↓'} ${pctChg}%</span>`;
}

function getEAP(){return(EAP[D.mc_year]&&EAP[D.mc_year][D.mc_prov])||EAP[2025].gauteng;}
function eB(){const e=getEAP();return BLK.reduce((a,r)=>a+(e[r]||0),0);}
function eF(){const e=getEAP();return['AF','CF','IF'].reduce((a,r)=>a+(e[r]||0),0);}
function bN(id){return RACES.reduce((a,r)=>a+(mhc[id][r]||0),0);}
function bBl(id){return BLK.reduce((a,r)=>a+(mhc[id][r]||0),0);}
function bFm(id){return['AF','CF','IF'].reduce((a,r)=>a+(mhc[id][r]||0),0);}
function pr(a,t,max){if(!t||a===null)return 0;const r=a/t,fl=FL[stance];if(r>=1)return max;if(r>=fl)return Math.round(r*max*100)/100;return 0;}
function prI(a,t,max){if(a===null)return 0;if(a<=t)return max;return Math.max(0,Math.round((2-a/t)*max*100)/100);}
function bn(v,max){if(v===true||v==='yes')return max;if(v==='partial')return max*.5;return 0;}
function r2(n){return Math.round(n*100)/100;}
function pct(n){return Math.round(n*100);}

function col(p){return p>=.70?'var(--acc-e)':p>=.40?'var(--acc-s)':'var(--acc-red)';}
function stC(s){return s==='m'?'var(--acc-e)':s==='p'?'var(--acc-s)':'var(--acc-red)';}
function rat(p){return p>=.85?'EXCELLENT':p>=.70?'GOOD':p>=.50?'ADEQUATE':'NEEDS ATTENTION';}
function chipClass(p){return p>=.70?'chip-e':p>=.40?'chip-a':'chip-r';}

function calcMC(){
  let pts=0;const res={};
  MCB.forEach(b=>{const n=bN(b.id),bl=bBl(b.id),fm=bFm(b.id);const bt=b.eap?eB():b.bTgt||0,ft=b.eap?eF():(b.fTgt||0);const bP=n?bl/n:0,fP=n?fm/n:0;res[b.id]={n,bl,fm,bP,fP,bPts:pr(bP,bt,b.bPts),fPts:b.nof?0:pr(fP,ft,b.fPts||0),bt,ft};});
  if(D.mc_combined){const n=bN('otherexec')+bN('senior'),bl=bBl('otherexec')+bBl('senior'),fm=bFm('otherexec')+bFm('senior');const bP=n?bl/n:0,fP=n?fm/n:0;res['comb']={n,bl,fm,bP,fP,bPts:pr(bP,.60,4),fPts:pr(fP,.30,2),bt:.60,ft:.30};['board','exdir','middle','junior'].forEach(id=>{pts+=res[id].bPts+res[id].fPts;});pts+=res['pwd'].bPts+res['comb'].bPts+res['comb'].fPts;}
  else{MCB.forEach(b=>{pts+=res[b.id].bPts+(b.nof?0:res[b.id].fPts);});}
  return{pts:r2(pts),res};
}
function calcAll(){
  const mc=calcMC();
  const s1=(D.fleet_diesel*EF.diesel/1000)+(D.gen_litres*EF.diesel/1000)+(D.lpg_kg*EF.lpg/1000)+(D.car_litres*EF.petrol/1000);
  const s2=Math.max(0,(D.elec_kwh*EF.elec/1000)-(D.solar_kwh*EF.solar/1000));
  const s3=D.water_kl*EF.water;
  const re=D.elec_kwh>0?D.solar_kwh/D.elec_kwh:0,ev=D.fleet_total>0?D.ev_count/D.fleet_total:0;
  const yoy=D.prior_s12>0?Math.max(0,(D.prior_s12-(s1+s2))/D.prior_s12):0;
  const ghg={s1b:s1>0?5:0,yoy:D.prior_s12>0?pr(yoy,.10,10):0,sol:pr(re,.20,8),s3:s3>0?5:0,sbti:D.sbti?5:0};
  const en={kwh:D.elec_kwh>0?5:0,yoy:D.energy_yoy?5:0,re:pr(re,.20,8)};
  const fl={norm:0,int:0,ev:pr(ev,.05,5)};
  const wa={div:pr(D.waste_div,75,5),card:D.waste_card>0?4:0,lf:D.landfill_co2>0?3:0};
  const wt={track:D.water_kl>0?4:0,init:D.water_init?3:0};
  const iso={cert:D.iso14001==='certified'?8:0,asp:D.aspects?4:0,pol:bn(D.env_policy,4),leg:D.legal_reg?4:0};
  const eT=r2([ghg,en,fl,wa,wt,iso].flatMap(o=>Object.values(o)).reduce((a,v)=>a+v,0));
  const ee={mc:Math.min(17,mc.pts),plan:5,forum:3,tgt:3};
  const wsp={wsp:D.wsp?5:0,atr:D.atr?5:0,hrs:pr(D.train_hrs,40,5),grnt:pr(D.grant_pct,80,5)};
  const hs={ltifr:D.ltifr!==null?prI(D.ltifr,2,8):0,fat:D.fatalities===0?8:0,ftg:D.fatigue?5:0,inc:D.incidents?4:0};
  const csi={spend:D.npat>0?pr(D.csi_pct,1,5):0,cal:pr(D.initiatives,6,5),loc:pr(D.local_pct,40,5),sup:pr(D.sup_hs,80,5)};
  const sT=r2([ee,wsp,hs,csi].flatMap(o=>Object.values(o)).reduce((a,v)=>a+v,0));
  const k5=D.king5/170;
  const brd={blk:pr(D.board_blk/100,.50,2),fem:pr(D.board_fem/100,.25,1)};
  const kv={score:r2(k5*25),sec:D.sec_active?5:0,rem:D.esg_rem?5:0};
  const iDiscs=[D.ifrs_board,D.ifrs_mgmt,D.ifrs_risks,D.ifrs_opps,D.ifrs_scenario,D.ifrs_risk_id,D.ifrs_erm,D.ifrs_ghg_tgt,D.ifrs_trans_plan,D.ifrs_phys_board,D.ifrs_trans_board];
  const ifrs={disc:r2(iDiscs.reduce((a,v)=>a+bn(v,1),0)/iDiscs.length*10),clim:bn(D.ifrs_erm,5)};
  const garp={erm:D.erm_phys&&D.erm_trans?8:4,grap:D.grap_sec?5:0};
  const eth={code:(D.code_ethics&&D.hotline)?4:(D.code_ethics||D.hotline)?2:0,popia:bn(D.popia,5),legal:bn(D.risk_reg,5),assur:D.ext_assur?5:0,rep:D.int_report?8:0,pen:D.no_penalties?5:0};
  const gT=r2([brd,kv,ifrs,garp,eth].flatMap(o=>Object.values(o)).reduce((a,v)=>a+v,0));
  const ghgT=Object.values(ghg).reduce((a,v)=>a+v,0);
  const enT=Object.values(en).reduce((a,v)=>a+v,0);
  const flT=Object.values(fl).reduce((a,v)=>a+v,0);
  const waT=Object.values(wa).reduce((a,v)=>a+v,0);
  const wtT=Object.values(wt).reduce((a,v)=>a+v,0);
  const isoT=Object.values(iso).reduce((a,v)=>a+v,0);
  const wspT=Object.values(wsp).reduce((a,v)=>a+v,0);
  const hsT=Object.values(hs).reduce((a,v)=>a+v,0);
  const csiT=Object.values(csi).reduce((a,v)=>a+v,0);
  const brdT=Object.values(brd).reduce((a,v)=>a+v,0);
  const kvT=r2(Object.values(kv).reduce((a,v)=>a+v,0));
  const ifrsT=r2(Object.values(ifrs).reduce((a,v)=>a+v,0));
  const garpT=r2(Object.values(garp).reduce((a,v)=>a+v,0));
  const ethT=r2(Object.values(eth).reduce((a,v)=>a+v,0));
  return{mc,s1,s2,s3,re,ev,yoy,ghg,en,fl,wa,wt,iso,eT,ee,wsp,hs,csi,sT,brd,kv,ifrs,garp,eth,gT,ghgT,enT,flT,waT,wtT,isoT,wspT,hsT,csiT,brdT,kvT,ifrsT,garpT,ethT,k5};
}

function go(page){

  const btn=document.querySelector(`[onclick="go('${page}')"]`);

  renderPage(page,calcAll());
}

function crNetOffset(){
  const purchased = CR.purchases.filter(c=>c.status==='verified').reduce((a,c)=>a+c.volume,0);
  const retired = CR.retired.reduce((a,c)=>a+c.volume,0);
  return {purchased, retired, net: purchased};
}

function addCredit(date, standard, type, volume, cost, registry, project, status){
  CR.purchases.push({id:CR.nextId++, date, standard, type, volume:parseFloat(volume)||0, cost:parseFloat(cost)||0, registry, project, status});
  recalc();
}

function retireCredit(id){
  const idx = CR.purchases.findIndex(c=>c.id===id);
  if(idx>=0){
    const c = CR.purchases[idx];
    if(c.status==='verified'){
      CR.retired.push({...c, retiredDate: new Date().toISOString().split('T')[0]});
      CR.purchases.splice(idx,1);
      recalc();
    }
  }
}

function deleteCredit(id){
  const idx = CR.purchases.findIndex(c=>c.id===id);
  if(idx>=0){CR.purchases.splice(idx,1);recalc();}
}

// PASTE ENGINE — parses tab-separated Excel content
// Supports two formats:
// Format A: rows = metrics, cols = periods (with optional label in col 0)
// Format B: cols = metrics, rows = periods (transposed — e.g. EEA2 extract)
function parsePaste(txt, fieldKeys){
  const rows=txt.trim().split('\n').map(r=>r.split('\t').map(c=>c.trim().replace(/,/g,'')));
  if(!rows.length) return {ok:false,msg:'No data found.',matched:0};

  const cleanNum=s=>{if(!s||s===''||s==='-'||s.toLowerCase()==='n/a'||s.toLowerCase()==='null')return null;const n=parseFloat(s.replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;};

  // Detect if first row is a header
  const firstRowHasNums=rows[0].some(c=>cleanNum(c)!==null&&cleanNum(c)!==0);
  const hasHeader=!firstRowHasNums;
  const dataRows=hasHeader?rows.slice(1):rows;
  const headerRow=hasHeader?rows[0]:null;

  // Build a label→fieldKey map (fuzzy)
  const labelMap={};
  const fmap={
    'fleet diesel':'fleet_diesel','fleet fuel':'fleet_diesel','diesel litres':'fleet_diesel','fuel litres':'fleet_diesel',
    'generator':'gen_litres','gen diesel':'gen_litres',
    'lpg':'lpg_kg','forklift':'lpg_kg',
    'petrol':'car_litres','business car':'car_litres',
    'electricity':'elec_kwh','elec':'elec_kwh','kwh':'elec_kwh','grid':'elec_kwh',
    'solar':'solar_kwh','pv':'solar_kwh','renewable':'solar_kwh',
    'water':'water_kl',
    'waste diversion':'waste_div','diversion':'waste_div',
    'cardboard':'waste_card','recycling':'waste_card',
    'landfill':'landfill_co2',
    'ev':'ev_count','electric vehicle':'ev_count',
    'training':'train_hrs','train':'train_hrs',
    'grant':'grant_pct','mandatory grant':'grant_pct',
    'ltifr':'ltifr','lost time':'ltifr',
    'fatal':'fatalities','fatalities':'fatalities',
    'csi':'csi_pct','sed':'csi_pct','social spend':'csi_pct',
    'initiative':'initiatives','social calendar':'initiatives',
    'local':'local_pct','local labour':'local_pct',
    'supplier h':'sup_hs','ims':'sup_hs',
    'board black':'board_blk','black board':'board_blk',
    'board female':'board_fem','female board':'board_fem',
    'king':'king5','king v':'king5',
  };
  function matchField(s){
    const sl=s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    for(const[k,v] of Object.entries(fmap)){if(sl.includes(k))return v;}
    return null;
  }

  let matched=0;
  const results={};

  // FORMAT A: each row = one metric, with period values across columns
  // Detect: if column count = 9 or 10 (9 periods + optional label), or matches period count
  const isFmtA=dataRows.some(r=>{
    const nums=r.filter(c=>cleanNum(c)!==null);
    return nums.length>=7; // at least 7 of 9 months present
  });

  if(isFmtA){
    for(const row of dataRows){
      if(!row[0])continue;
      const fk=matchField(row[0]);
      if(!fk)continue;
      // Find numeric values — up to 9
      const vals=[];
      for(let i=1;i<row.length&&vals.length<9;i++){
        const n=cleanNum(row[i]);
        vals.push(n);
      }
      // Pad/trim to 9 periods
      while(vals.length<9)vals.push(null);
      if(vals.some(v=>v!==null)){
        results[fk]=vals.slice(0,9);
        matched++;
      }
    }
  } else {
    // FORMAT B: each row = one period, columns = metrics
    // Use header row to map columns to fields
    if(headerRow){
      const colMap={};
      headerRow.forEach((h,i)=>{const fk=matchField(h);if(fk)colMap[i]=fk;});
      for(let pi=0;pi<dataRows.length&&pi<9;pi++){
        const row=dataRows[pi];
        for(const[ci,fk] of Object.entries(colMap)){
          const n=cleanNum(row[parseInt(ci)]);
          if(n!==null){
            if(!results[fk])results[fk]=Array(9).fill(null);
            results[fk][pi]=n;
            matched++;
          }
        }
      }
    }
  }

  // Apply results to TS
  for(const[k,vals] of Object.entries(results)){
    if(TS[k]!==undefined){
      TS[k]=vals.map((v,i)=>v!==null?v:TS[k][i]);
    }
  }
  if(matched>0) syncTStoD();
  return{ok:matched>0,msg:matched>0?'Loaded data for '+matched+' field'+(matched>1?'s':'')+' across '+PS+' periods.':'No matching fields found. Check row labels match field names (e.g. "Fleet Diesel", "Grid Electricity", "LTIFR").',matched};
}

function tsYTD(key){
  const f=IMP_FIELDS.environmental.concat(IMP_FIELDS.social).concat(IMP_FIELDS.governance).find(f=>f.key===key);
  if(!f)return 0;
  const vals=TS[key].filter(v=>v!==null);
  if(!vals.length)return 0;
  return f.sum?vals.reduce((a,v)=>a+v,0):Math.round(vals.reduce((a,v)=>a+v,0)/vals.length*100)/100;
}

function buildTemplateCSV(section){
  const fields=IMP_FIELDS[section];
  const header=['Metric / Period'].concat(PERIODS);
  const rows=fields.map(f=>[f.label+' ('+f.unit+')'].concat(TS[f.key].map(v=>v===null?'':v)));
  return [header].concat(rows).map(r=>r.join('\t')).join('\n');
}

function copyTemplate(section, btn){
  const txt=buildTemplateCSV(section);
  navigator.clipboard.writeText(txt).then(()=>{
    btn.classList.add('copied');btn.textContent='Copied!';
    setTimeout(()=>{btn.classList.remove('copied');btn.textContent='Copy template';},2000);
  }).catch(()=>{
    const ta=document.getElementById('paste-ta-'+section);if(ta)ta.value=txt;
  });
}

function applyPaste(section){
  const ta=document.getElementById('paste-ta-'+section);
  const st=document.getElementById('paste-st-'+section);
  if(!ta||!ta.value.trim()){if(st){st.textContent='';st.className='paste-status';}return;}
  const fieldKeys=IMP_FIELDS[section].map(f=>f.key);
  const res=parsePaste(ta.value,fieldKeys);
  if(st){
    st.textContent=res.msg;
    st.className='paste-status '+(res.ok?'pst-ok':'pst-err');
  }
  recalc();
}

function updateTSField(key, periodIdx, val){
  TS[key][periodIdx]=val===''||val===null?null:parseFloat(val)||0;
  syncTStoD();
  recalc();
}

/* ============================

   ============================ */
function pageAnalytics(sc){
  const MONTHS=['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  const s1Monthly = TS.fleet_diesel.map((v,i)=>(v||0)*EF.diesel/1000 + (TS.gen_litres[i]||0)*EF.diesel/1000 + (TS.lpg_kg[i]||0)*EF.lpg/1000 + (TS.car_litres[i]||0)*EF.petrol/1000);
  const s2Monthly = TS.elec_kwh.map((v,i)=>Math.max(0,(v||0)*EF.elec/1000 - (TS.solar_kwh[i]||0)*EF.solar/1000));
  const s3Monthly = TS.water_kl.map(v=>(v||0)*EF.water);
  const totalMonthly = s1Monthly.map((v,i)=>r2(v+s2Monthly[i]+s3Monthly[i]));
  const maxGhg = Math.max(...totalMonthly,1);

  function barChart(data, labels, accent, maxVal){
    const mx = maxVal||Math.max(...data,1);
    return '<div class="bar-chart">' + data.map((v,i)=>{
      const h = Math.round((v/mx)*90);
      const dv = typeof v==='number'?v.toFixed(v<10?2:1):'—';
      return `<div class="bc-bar" style="height:${h}px;background:${accent};opacity:${0.5+0.5*(v/mx)}" data-lbl="${labels[i]}" data-val="${dv}"></div>`;
    }).join('') + '</div>';
  }

  const cr = crNetOffset();
  const netGhg = Math.max(0,(sc.s1+sc.s2+sc.s3) - cr.net/1000);
  const carbonTaxT1 = Math.round((sc.s1+sc.s2)*0.4*236);

  return`<div class="page-eyebrow">Analytics</div>
  <div class="page-hdr"><h2>Sustainability <span class="acc-e">Analytics</span></h2>
  <p>Monthly actuals · GHG trend · Scope breakdown · Carbon tax · Sustainability report data extract</p></div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
    ${[
      ['Total GHG YTD',(r2(sc.s1+sc.s2+sc.s3)/1000).toFixed(2)+'k tCO₂e','Scope 1+2+3','var(--acc-e)'],
      ['Net GHG (less credits)',r2(netGhg).toFixed(1)+' tCO₂e','After '+cr.net+' tCO₂e credits','var(--acc-e)'],
      ['Carbon tax exposure','R'+carbonTaxT1.toLocaleString(),'Tier 1 @R236/tCO₂e · 40% net','var(--acc-s)'],
      ['Renewable %',Math.round(sc.re*100)+'%','of grid kWh · target ≥20%',sc.re>=.20?'var(--acc-e)':'var(--acc-red)'],
    ].map(([l,v,s,c])=>`<div class="glass kpi"><div class="kl">${l}</div><div class="kv" style="color:${c}">${v}</div><div class="ks">${s}</div></div>`).join('')}
  </div>

  <div class="glass card" style="margin-bottom:12px">
    <div class="card-ttl">GHG emissions by month (tCO₂e) — Scope 1+2+3
      <span class="ct-badge" style="color:var(--acc-e);border-color:rgba(29,233,160,.3);background:rgba(29,233,160,.08)">YTD ${r2(sc.s1+sc.s2+sc.s3).toFixed(1)} tCO₂e</span>
    </div>
    ${barChart(totalMonthly, MONTHS, 'var(--acc-e)', maxGhg)}
    <div class="chart-legend">
      <div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--acc-e)"></div>Total Scope 1+2+3 (tCO₂e)</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    <div class="glass card">
      <div class="card-ttl">Scope 1 — combustion (tCO₂e/month)</div>
      ${barChart(s1Monthly.map(v=>r2(v)), MONTHS, 'rgba(255,95,95,.7)', Math.max(...s1Monthly,1))}
    </div>
    <div class="glass card">
      <div class="card-ttl">Scope 2 — electricity net (tCO₂e/month)</div>
      ${barChart(s2Monthly.map(v=>r2(v)), MONTHS, 'rgba(74,168,255,.7)', Math.max(...s2Monthly,1))}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    <div class="glass card">
      <div class="card-ttl">Fleet diesel by month (litres)</div>
      ${barChart(TS.fleet_diesel.map(v=>v||0), MONTHS, 'var(--acc-s)', Math.max(...TS.fleet_diesel.map(v=>v||0),1))}
    </div>
    <div class="glass card">
      <div class="card-ttl">Grid electricity by month (kWh)</div>
      ${barChart(TS.elec_kwh.map(v=>v||0), MONTHS, 'var(--acc-g)', Math.max(...TS.elec_kwh.map(v=>v||0),1))}
    </div>
  </div>

  <div class="glass card">
    <div class="card-ttl">Sustainability report data extract — GRI / IFRS S2 aligned</div>
    <table class="cr-table">
      <thead><tr><th>Disclosure</th><th>Framework</th><th>Unit</th><th style="text-align:right">YTD value</th><th>Status</th></tr></thead>
      <tbody>
      ${[
        ['GHG: Scope 1 emissions','GRI 305-1 · IFRS S2','tCO₂e',r2(sc.s1).toFixed(2),sc.s1>0],
        ['GHG: Scope 2 emissions (net)','GRI 305-2 · IFRS S2','tCO₂e',r2(sc.s2).toFixed(2),sc.s2>=0],
        ['GHG: Scope 3 — water','GRI 305-3','tCO₂e',r2(sc.s3).toFixed(3),sc.s3>0],
        ['GHG: Net after credits','SBTi CNZS 2.0','tCO₂e',r2(netGhg).toFixed(2),true],
        ['Energy: Grid electricity','GRI 302-1','kWh',D.elec_kwh.toLocaleString(),D.elec_kwh>0],
        ['Energy: Renewable generated','GRI 302-1','kWh',D.solar_kwh.toLocaleString(),D.solar_kwh>0],
        ['Energy: RE % of total','GRI 302-1','%',Math.round(sc.re*100),D.elec_kwh>0],
        ['Water: Total consumption','GRI 303-3','kL',D.water_kl.toLocaleString(),D.water_kl>0],
        ['Waste: Diversion rate (CPT)','GRI 306-3','%',D.waste_div,D.waste_div>0],
        ['Carbon tax: Tier 1 exposure','Carbon Tax Act 15 of 2019','ZAR','R'+carbonTaxT1.toLocaleString(),true],
        ['Carbon credits: Purchased','VCS/GS registry','tCO₂e',cr.purchased,true],
        ['Carbon credits: Net offset','SBTi',  'tCO₂e',cr.net,true],
      ].map(([l,fw,u,v,ok])=>`<tr>
        <td>${l}</td><td style="font-size:11px;color:var(--text3)">${fw}</td><td style="font-size:11px;color:var(--text3)">${u}</td>
        <td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${v}</td>
        <td>${ok?'<span class="chip chip-e">AVAILABLE</span>':'<span class="chip chip-r">MISSING</span>'}</td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

        ${[
          ['EV fleet transition (CPT + PE first)','Scope 1','−15 to −40% diesel over 5 yrs','R4.2M for 10 vehicles','4–6 yrs','Plan — no EVs yet'],
          ['Solar PV all 5 depots','Scope 2','−60 to −100% electricity net','R3.5M for 50%+ RE','5–7 yrs','In progress (JHB)'],
          ['Eco-driving programme','Scope 1','−8 to −12% L/100km','R350K training + telematics','<2 yrs','Driver Debrief active'],
          ['Waste zero-landfill (extend Oricol)','Scope 3','−100% landfill tCO₂e','R120K contractor rollout','1–2 yrs','CPT only (91.1%)'],
          ['Water efficiency initiatives','Scope 3','−10 to −20% kL','R95K (CT dam + DBN)','2–3 yrs','Partial — 2 depots'],
          ['Carbon credits (offset residual)','Net GHG','Up to 100% offset','Market rate R90–200/tCO₂e','Immediate',''+cr.net+' tCO₂e held'],
        ].map(([l,s,r,c,p,st])=>`<tr>
          <td style="font-weight:500">${l}</td>
          <td style="font-size:11px"><span class="chip chip-e">${s}</span></td>
          <td style="font-size:12px;color:var(--acc-e)">${r}</td>
          <td style="font-size:11px;color:var(--text3)">${c}</td>
          <td style="font-size:11px;color:var(--text3)">${p}</td>
          <td style="font-size:11px;color:var(--text2)">${st}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ============================
   CARBON CREDITS PAGE
   ============================ */
function pageCredits(sc){
  const cr = crNetOffset();
  const ghgBase = sc.s1+sc.s2+sc.s3;
  const netGhg = Math.max(0, ghgBase - cr.net/1000);

  return`<div class="page-eyebrow">Carbon Credits</div>
  <div class="page-hdr"><h2>Carbon Credit <span class="acc-e">Register</span></h2>
  <p>VCS · Gold Standard · South Pole · Carbon Offset Initiative · SBTi compliant offsetting · GHG Protocol</p></div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
    ${[
      ['Verified credits held',CR.purchases.filter(c=>c.status==='verified').reduce((a,c)=>a+c.volume,0)+' tCO₂e','Ready to retire','var(--acc-e)'],
      ['Pending verification',CR.purchases.filter(c=>c.status==='pending').reduce((a,c)=>a+c.volume,0)+' tCO₂e','Awaiting registry confirmation','var(--acc-s)'],
      ['Total retired',cr.retired+' tCO₂e','Permanently cancelled','var(--text2)'],
      ['Net GHG after credits',netGhg.toFixed(1)+' tCO₂e','Gross '+r2(ghgBase).toFixed(1)+' less offsets','var(--acc-e)'],
    ].map(([l,v,s,c])=>`<div class="glass kpi"><div class="kl">${l}</div><div class="kv" style="color:${c}">${v}</div><div class="ks">${s}</div></div>`).join('')}
  </div>

  <div class="glass card" style="margin-bottom:12px">
    <div class="card-ttl">Add credit purchase</div>
    <div class="cr-form" id="cr-form">
      <div class="cr-field"><label>Date</label><input type="date" id="cr-date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="cr-field"><label>Standard</label>
        <select id="cr-standard"><option>VCS (Verra)</option><option>Gold Standard</option><option>ACR</option><option>CAR</option><option>Social Carbon</option><option>ISO 14064</option></select>
      </div>
      <div class="cr-field"><label>Type</label>
        <select id="cr-type"><option value="REDD+">REDD+ (Deforestation)</option><option value="RE">Renewable Energy</option><option value="EE">Energy Efficiency</option><option value="Blue">Blue Carbon</option><option value="Soil">Soil Carbon</option><option value="Direct Air">Direct Air Capture</option></select>
      </div>
      <div class="cr-field"><label>Volume (tCO₂e)</label><input type="number" id="cr-volume" placeholder="0" min="1"></div>
      <div class="cr-field"><label>Cost (ZAR total)</label><input type="number" id="cr-cost" placeholder="0"></div>
      <div class="cr-field"><label>Registry / Serialno</label><input type="text" id="cr-registry" placeholder="e.g. VCS-3456-2025"></div>
      <div class="cr-field" style="grid-column:1/3"><label>Project name / description</label><input type="text" id="cr-project" placeholder="e.g. Amazon Forest Protection BR-001"></div>
      <div class="cr-field"><label>Status</label>
        <select id="cr-status"><option value="verified">Verified</option><option value="pending">Pending verification</option><option value="anticipated">Anticipated</option></select>
      </div>
      <div class="cr-field" style="display:flex;align-items:flex-end">
        <button class="cr-add-btn" style="width:100%" onclick="
          addCredit(
            document.getElementById('cr-date').value,
            document.getElementById('cr-standard').value,
            document.getElementById('cr-type').value,
            document.getElementById('cr-volume').value,
            document.getElementById('cr-cost').value,
            document.getElementById('cr-registry').value,
            document.getElementById('cr-project').value,
            document.getElementById('cr-status').value
          );
          document.getElementById('cr-volume').value='';
          document.getElementById('cr-cost').value='';
          document.getElementById('cr-registry').value='';
          document.getElementById('cr-project').value='';
        ">+ Add credit</button>
      </div>
    </div>
  </div>

  <div class="glass card" style="margin-bottom:12px">
    <div class="card-ttl">Active credit portfolio (${CR.purchases.length} holdings)
      <span class="ct-badge" style="color:var(--acc-e);border-color:rgba(29,233,160,.3);background:rgba(29,233,160,.08)">${CR.purchases.reduce((a,c)=>a+c.volume,0)} tCO₂e total</span>
    </div>
    ${CR.purchases.length===0?'<div style="font-size:12px;color:var(--text3);padding:8px 0">No credits registered. Add a purchase above.</div>':''}
    ${CR.purchases.length>0?`<div style="overflow-x:auto"><table class="cr-table">
      <thead><tr>
        <th>Date</th><th>Standard</th><th>Type</th><th>Project</th><th>Registry</th>
        <th style="text-align:right">Volume (tCO₂e)</th><th style="text-align:right">Cost (ZAR)</th>
        <th style="text-align:right">ZAR/tCO₂e</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody>
      ${CR.purchases.map(c=>`<tr>
        <td style="font-size:11px;color:var(--text3)">${c.date}</td>
        <td style="font-size:11px">${c.standard}</td>
        <td><span class="chip chip-e" style="font-size:9px">${c.type}</span></td>
        <td style="font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.project}</td>
        <td style="font-size:11px;color:var(--text3)">${c.registry}</td>
        <td style="text-align:right;font-weight:600;color:var(--acc-e)">${c.volume.toLocaleString()}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">${c.cost>0?'R'+c.cost.toLocaleString():'—'}</td>
        <td style="text-align:right;font-size:11px;color:var(--text3)">${c.cost>0&&c.volume>0?'R'+Math.round(c.cost/c.volume):'—'}</td>
        <td><span class="chip ${c.status==='verified'?'chip-e':c.status==='pending'?'chip-a':'chip-r'}">${c.status.toUpperCase()}</span></td>
        <td style="white-space:nowrap">
          ${c.status==='verified'?`<button class="cr-retire-btn" onclick="retireCredit(${c.id})">Retire</button> `:''}
          <button class="cr-delete-btn" onclick="if(confirm('Remove this credit?'))deleteCredit(${c.id})">×</button>
        </td>
      </tr>`).join('')}
      </tbody>
      <tfoot><tr style="border-top:1px solid var(--glass-border)">
        <td colspan="5" style="font-weight:600;font-size:12px;padding:8px 10px">TOTALS</td>
        <td style="text-align:right;font-weight:700;color:var(--acc-e)">${CR.purchases.reduce((a,c)=>a+c.volume,0).toLocaleString()}</td>
        <td style="text-align:right;font-weight:600">R${CR.purchases.reduce((a,c)=>a+c.cost,0).toLocaleString()}</td>
        <td colspan="3"></td>
      </tr></tfoot>
    </table></div>`:''}
  </div>

  ${CR.retired.length>0?`<div class="glass card">
    <div class="card-ttl">Retired credits (${CR.retired.length} cancellations · ${cr.retired} tCO₂e permanently offset)</div>
    <table class="cr-table"><thead><tr><th>Date retired</th><th>Standard</th><th>Project</th><th style="text-align:right">Volume</th><th>Serial</th></tr></thead>
    <tbody>${CR.retired.map(c=>`<tr>
      <td style="font-size:11px;color:var(--text3)">${c.retiredDate}</td><td style="font-size:11px">${c.standard}</td>
      <td style="font-size:11px">${c.project}</td>
      <td style="text-align:right;font-weight:600;color:var(--text3)">${c.volume.toLocaleString()} tCO₂e</td>
      <td style="font-size:11px;color:var(--text3)">${c.registry}</td>
    </tr>`).join('')}</tbody></table>
  </div>`:''}`;
}

syncTStoD();
recalc();
go('overview');
</script>
