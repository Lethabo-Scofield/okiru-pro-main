# Prod ingress: explicit okiru.pro host rules (server-alias does not apply path rules to aliased domains).
# Base paths: ../../base/ingress/ingress.yaml
#
# KEEP IN STEP WITH THE LIVE INGRESS. Every /api prefix the web server owns
# must be listed here, longer than the /api catch-all, or nginx sends it to the
# api service and it 404s ("Cannot POST") — /api/tokens was dead for three
# weeks that way, and the website's demo requests were all lost. Synced with
# the live okiru-ingress on 2026-10-07 (sprint task H1): sign-in moved wholly
# to web (/api/auth), and tokens, telemetry, vocabulary, activity, scorecards,
# audit and privacy were missing here — re-applying the old copy would have
# broken payments, telemetry and sign-in.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: okiru-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://okiru.pro,https://www.okiru.pro,https://okiru.4.253.195.45.nip.io"
    # Evidence packs (multi-file ledger/PDF batches for the parser quote-files
    # upload) routinely exceed 100m; nginx 413'd them before reaching the app.
    # Parser multer allows 50MB x 100 files, so 500m gives real headroom.
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  tls:
    - hosts:
        - okiru.pro
        - www.okiru.pro
      secretName: okiru-pro-tls
  rules:
    - host: okiru.pro
      http:
        paths:
          # Sign-in, sign-up, codes and sessions all live on web.
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/onboarding/me
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/onboarding
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/workspaces
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/invites
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/feedback
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Organization / company team management (members, invite, admin
          # transfer) — web owns these (invite email + workspace infra live on
          # web). Longer prefix than /api so nginx routes here, not to api.
          - path: /api/organization
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/clients
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Workbook data routes (web server owns ALL /api/workbook/* — NOT on api backend)
          - path: /api/workbook
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # ESG workbook routes (web server owns ALL /api/esg/* — NOT on api backend)
          - path: /api/esg
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Admin/demo routes on web: Lake Trading demo, rollback (NOT on api backend)
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Excel import normalisation endpoint (web only)
          - path: /api/excel-import
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # okiru-ai-parser document routes — web Express proxies /api/parser/*
          # to the parser service. Longer prefix than /api so nginx picks it
          # before the api catch-all (apps/api has no parser proxy → would 404).
          - path: /api/parser
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/organizations
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/sector-templates
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5001
          # The website's "Book a demo" form.
          - path: /api/demo-request
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Token wallet and payments.
          - path: /api/tokens
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/telemetry
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/vocabulary
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/activity
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/scorecards
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/audit
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/privacy
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
    - host: www.okiru.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
