# Prod ingress: explicit okiru.pro host rules (server-alias does not apply path rules to aliased domains).
# Base paths: ../../base/ingress/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: okiru-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://okiru.pro,https://www.okiru.pro,https://okiru.20.164.101.114.nip.io"
    # Evidence packs (multi-file ledger/PDF batches for the parser quote-files
    # upload) routinely exceed 100m; nginx 413'd them before reaching the app.
    # Parser multer allows 50MB x 100 files, so 500m gives real headroom.
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  tls:
    - hosts:
        - okiru.20.164.101.114.nip.io
        - okiru.pro
        - www.okiru.pro
      secretName: okiru-pro-tls
  rules:
    - host: okiru.pro
      http:
        paths:
          - path: /api/auth/login
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/auth/me
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/auth/logout
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/auth/register
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/onboarding/me
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/onboarding
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/workspaces
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/invites
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/feedback
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Organization / company team management (members, invite, admin
          # transfer) — web owns these (invite email + workspace infra live on
          # web). Longer prefix than /api so nginx routes here, not to api.
          - path: /api/organization
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/clients
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Workbook data routes (web server owns ALL /api/workbook/* — NOT on api backend)
          - path: /api/workbook
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # ESG workbook routes (web server owns ALL /api/esg/* — NOT on api backend)
          - path: /api/esg
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Admin/demo routes on web: Lake Trading demo, rollback (NOT on api backend)
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Excel import normalisation endpoint (web only)
          - path: /api/excel-import
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # okiru-ai-parser document routes — web Express proxies /api/parser/*
          # to the parser service. Longer prefix than /api so nginx picks it
          # before the api catch-all (apps/api has no parser proxy → would 404).
          - path: /api/parser
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /api/organizations
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/auth/check-username
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api/sector-templates
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
    - host: www.okiru.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
