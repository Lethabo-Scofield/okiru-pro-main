apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: okiru-pro

resources:
- ../../base

# secrets are managed directly by the CI workflow via kubectl — NOT via Kustomize
# to prevent placeholder ${VAR} values from overwriting real cluster secrets on every deploy

patchesStrategicMerge:
- patches/ingress-patch.yaml
- patches/resource-limits.yaml
- patches/replica-count.yaml
- patches/configmap-patch.yaml
- patches/pvc-storage-class.yaml
- patches/security-context.yaml

# Images - updated during deployment
# 2026-07-30: migrated to okiruproacr2026 (new news@okiru.biz subscription a566a919;
# old ACR okiruproacrde4d539b is locked inside the disabled cfc3d77c subscription).
images:
- name: okiruproacrde4d539b.azurecr.io/okiru-pro/api
  newName: okiruproacr.azurecr.io/okiru-pro/api
  newTag: "e748c517-20260818"
- name: okiruproacrde4d539b.azurecr.io/okiru-pro/compute
  newName: okiruproacr.azurecr.io/okiru-pro/compute
  newTag: "e748c517-20260818"
- name: okiruproacrde4d539b.azurecr.io/okiru-pro/web
  newName: okiruproacr.azurecr.io/okiru-pro/web
  newTag: "e748c517-20260818"
- name: okiruproacrde4d539b.azurecr.io/okiru-pro/parser
  newName: okiruproacr.azurecr.io/okiru-pro/parser
  newTag: "e748c517-20260818"

# Use 'labels' instead of 'commonLabels' to avoid modifying selectors
# which are immutable after deployment creation
labels:
- pairs:
    app.kubernetes.io/instance: okiru-pro-prod
    environment: production

configMapGenerator:
- behavior: merge
  literals:
  - NODE_ENV=production
  - LOG_LEVEL=warn
  - CORS_ORIGIN=https://okiru.pro,https://www.okiru.pro,https://okiru.4.253.195.45.nip.io
  - ESG_PREVIEW_ALLOWLIST=
  name: app-config

