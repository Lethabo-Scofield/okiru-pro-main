apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: okiru-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  rules:
    - host: okiru-staging.20.164.101.114.nip.io
      http:
        paths:
          - path: /api/clients
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Workbook data routes (web server owns ALL /api/workbook/* — NOT on api backend)
          - path: /api/workbook
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Admin/demo routes on web: Lake Trading demo, rollback (NOT on api backend)
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          # Excel import normalisation endpoint (web only)
          - path: /api/excel-import
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: okiru-ingress-compute
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  rules:
    - host: okiru-staging.20.164.101.114.nip.io
      http:
        paths:
          - path: /compute(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: compute
                port:
                  number: 8000
