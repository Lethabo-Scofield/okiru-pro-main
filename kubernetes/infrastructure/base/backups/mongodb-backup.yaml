# Nightly MongoDB backup.
#
# THE ORDERING BUG THIS FIXES, because it must not come back.
#
# `mongodump` and `azure-sync` used to be two entries under `containers:`.
# Kubernetes starts every container in a pod at the same time, so the sync
# container picked "the newest dated directory" and began uploading it while
# mongodump was still writing into it. Discovered 17 September 2026 by the first
# restore drill: the on-disk dump of `documents` was 66,302,543 bytes written at
# 02:00:30, and the copy in blob storage was 37,923,821 bytes uploaded at
# 02:00:28 — two seconds before the file it was copying was finished.
#
# `mongorestore` of that blob copy recovered 68 of 139 documents and stopped
# with "unexpected EOF". Every night in the retention window was truncated the
# same way, so the off-cluster backup had never been restorable. The on-cluster
# copy was always complete; the second copy, the one that exists precisely for
# the case where the cluster is gone, was not.
#
# `--validate-content` did not catch it: it checks that the bytes that were sent
# arrived intact, not that they were all of the file.
#
# THE FIX. mongodump is now an initContainer, so it runs to completion before
# the sync container starts — Kubernetes guarantees that ordering, which two
# containers in `containers:` never did. On top of that the dump writes a
# COMPLETE marker as its last act and the sync refuses to upload a directory
# without one, and after uploading, every blob's length is compared with the
# local file it came from. Two independent checks, because this failed silently
# for an unknown length of time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: okiru-pro
  labels:
    app: mongodb-backup
    app.kubernetes.io/instance: okiru-pro-prod
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: okiru-pro
    component: database
    environment: production
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            # STEP ONE. Runs to completion before anything else starts.
            - name: mongodump
              image: mongo:7.0
              command:
                - sh
                - -c
                - |
                  set -e
                  echo "Starting MongoDB backup at $(date)"
                  BACKUP_DIR="/backup/$(date +%Y%m%d-%H%M%S)"
                  mkdir -p "$BACKUP_DIR"

                  mongodump \
                    --host=mongodb \
                    --username="$MONGO_INITDB_ROOT_USERNAME" \
                    --password="$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase=admin \
                    --out="$BACKUP_DIR" \
                    --gzip

                  echo "Backup created: $(date -u)" > "$BACKUP_DIR/metadata.txt"
                  echo "MongoDB host: mongodb" >> "$BACKUP_DIR/metadata.txt"
                  echo "Database: $MONGODB_DB_NAME" >> "$BACKUP_DIR/metadata.txt"

                  # A manifest of what was written, so the sync step can check
                  # that what arrives in blob storage is the same size as what
                  # left. Written before the marker, on purpose.
                  ( cd "$BACKUP_DIR" && find . -type f ! -name COMPLETE -printf '%s %p\n' | sort -k2 ) \
                    > "$BACKUP_DIR/manifest.txt"

                  # The last act. Nothing uploads a directory without this.
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$BACKUP_DIR/COMPLETE"

                  # Keep seven days on the disk.
                  cd /backup
                  ls -t | tail -n +8 | xargs -r rm -rf

                  echo "Backup completed: $BACKUP_DIR"
                  ls -la "$BACKUP_DIR"
              env:
                - name: MONGO_INITDB_ROOT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-credentials
                      key: MONGO_INITDB_ROOT_USERNAME
                - name: MONGO_INITDB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-credentials
                      key: MONGO_INITDB_ROOT_PASSWORD
                - name: MONGODB_DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-credentials
                      key: MONGODB_DB_NAME
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 250m
                  memory: 512Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          containers:
            # STEP TWO. Cannot start until the dump above has exited zero.
            - name: azure-sync
              image: mcr.microsoft.com/azure-cli:latest
              command:
                - sh
                - -c
                - |
                  set -e
                  echo "Starting Azure Blob Storage sync at $(date)"

                  # Only a directory the dump declared finished. A partial dump
                  # is not a backup and must not overwrite the idea that we have
                  # one.
                  BACKUP_DIR=$(find /backup -mindepth 2 -maxdepth 2 -name COMPLETE \
                    | xargs -r -n1 dirname | sort | tail -1)

                  if [ -z "$BACKUP_DIR" ]; then
                    echo "FAIL: no completed backup directory found (no COMPLETE marker)"
                    exit 1
                  fi

                  NAME=$(basename "$BACKUP_DIR")
                  echo "Syncing completed backup: $BACKUP_DIR"

                  az storage blob upload-batch \
                    --account-name "$AZURE_STORAGE_ACCOUNT" \
                    --account-key "$AZURE_STORAGE_KEY" \
                    --destination "mongodb-backups/$NAME" \
                    --source "$BACKUP_DIR" \
                    --overwrite true \
                    --validate-content

                  # Verify sizes rather than trusting the exit code. This is the
                  # check that would have caught the truncation on the first
                  # night instead of after an unknown number of them.
                  echo "Verifying uploaded sizes against the manifest..."
                  az storage blob list \
                    --account-name "$AZURE_STORAGE_ACCOUNT" \
                    --account-key "$AZURE_STORAGE_KEY" \
                    --container-name mongodb-backups \
                    --prefix "$NAME/" \
                    --query "[].[properties.contentLength, name]" -o tsv > /tmp/remote.txt

                  # Shell builtins only: the azure-cli image has no awk, and a
                  # substring grep would match documents.bson.gz against
                  # documents.metadata.json.gz and report a false mismatch.
                  TAB=$(printf '\t')
                  MISMATCH=0
                  while read -r SIZE PATH_REL; do
                    REL=$(echo "$PATH_REL" | sed 's|^\./||')
                    [ "$REL" = "COMPLETE" ] && continue
                    [ "$REL" = "manifest.txt" ] && continue
                    REMOTE=$(while IFS="$TAB" read -r RSIZE RNAME; do
                      if [ "$RNAME" = "$NAME/$REL" ]; then echo "$RSIZE"; break; fi
                    done < /tmp/remote.txt)
                    if [ -z "$REMOTE" ]; then
                      echo "  MISSING  $REL"
                      MISMATCH=1
                    elif [ "$REMOTE" != "$SIZE" ]; then
                      echo "  SIZE     $REL local=$SIZE remote=$REMOTE"
                      MISMATCH=1
                    fi
                  done < "$BACKUP_DIR/manifest.txt"

                  if [ "$MISMATCH" -ne 0 ]; then
                    echo "FAIL: the copy in blob storage does not match what was written to disk."
                    exit 1
                  fi

                  echo "Verified: every file matches the manifest."
                  echo "Container: mongodb-backups"
                  echo "Path: $NAME"

                  # Thirty days off-cluster.
                  echo "Cleaning up old Azure backups..."
                  CUTOFF_DATE=$(date -d '30 days ago' +%Y%m%d)

                  az storage blob list \
                    --account-name "$AZURE_STORAGE_ACCOUNT" \
                    --account-key "$AZURE_STORAGE_KEY" \
                    --container-name mongodb-backups \
                    --query "[].name" -o tsv | \
                  while read blob; do
                    BLOB_DATE=$(echo "$blob" | grep -oE '^[0-9]{8}' || true)
                    if [ -n "$BLOB_DATE" ] && [ "$BLOB_DATE" -lt "$CUTOFF_DATE" ]; then
                      echo "Deleting old backup: $blob"
                      az storage blob delete \
                        --account-name "$AZURE_STORAGE_ACCOUNT" \
                        --account-key "$AZURE_STORAGE_KEY" \
                        --container-name mongodb-backups \
                        --name "$blob" \
                        --delete-snapshots include
                    fi
                  done

                  echo "Azure sync completed at $(date)"
              env:
                - name: AZURE_STORAGE_ACCOUNT
                  valueFrom:
                    secretKeyRef:
                      name: azure-backup-credentials
                      key: AZURE_STORAGE_ACCOUNT
                - name: AZURE_STORAGE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: azure-backup-credentials
                      key: AZURE_STORAGE_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 512Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mongodb-backup-pvc
