apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Environment
  NODE_ENV: "production"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"

  # API Configuration
  API_PORT: "5000"
  API_HOST: "0.0.0.0"

  # Web Configuration
  WEB_PORT: "5001"
  WEB_HOST: "0.0.0.0"
  API_URL: "https://api.okiru-pro.com"
  NEXT_PUBLIC_API_URL: "https://api.okiru-pro.com"
  API_SERVER_URL: "http://api:5000"

  # Computation Engine
  COMPUTE_PORT: "8000"
  COMPUTE_HOST: "0.0.0.0"
  COMPUTE_ENGINE_URL: "http://compute:8000"

  # Database Configuration (non-sensitive)
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
  MONGODB_OPTIONS: "retryWrites=true&w=majority"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # CORS Settings - will be overridden in overlays
  CORS_ORIGIN: "*"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"

  # Certificate Hub Blob Storage (non-secret; authentication uses Azure identity)
  AZURE_STORAGE_ACCOUNT_NAME: "okirubackups"
  AZURE_STORAGE_ACCOUNT_URL: "https://okirubackups.blob.core.windows.net"
  AZURE_STORAGE_CONTAINER_NAME: "certificates"
  AZURE_STORAGE_SAS_EXPIRY_SECONDS: "300"

  # Health Check Settings
  HEALTH_CHECK_ENABLED: "true"
  READINESS_CHECK_PATH: "/health"
  LIVENESS_CHECK_PATH: "/health"
