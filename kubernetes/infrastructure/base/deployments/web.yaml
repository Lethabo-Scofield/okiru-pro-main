apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    component: frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        component: frontend
        tier: web
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z api 5000; do
                echo "Waiting for API..."
                sleep 2
              done
      containers:
        - name: web
          image: okiruproacrde4d539b.azurecr.io/okiru-pro/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEB_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_URL
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NEXT_PUBLIC_API_URL
            - name: API_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_SERVER_URL
            # okiru-ai-parser (document→calculator service). apps/web/server/
            # apiProxy.ts forwards /api/parser/* here; without it the proxy
            # defaults to 127.0.0.1:3200 (local only) and document upload 502s.
            - name: PARSER_SERVICE_URL
              value: "http://parser:3200"
            # Wallet → parser settle handshake. /api/tokens/authorize debits
            # the organisation's token wallet, then marks the parser quote paid
            # with this shared secret. Unset, every authorize fails (and is
            # refunded), so uploads dead-end — it MUST equal the parser
            # Deployment's PARSER_INTERNAL_SECRET. optional only so a cluster
            # missing the key still schedules pods; the wallet itself fails
            # closed without it.
            - name: PARSER_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: session-secrets
                  key: PARSER_INTERNAL_SECRET
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGODB_URI
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: session-secrets
                  key: SESSION_SECRET
            # Workbook back-sync (Phase 1) — shared secret with apps/api.
            # When set on both apps, the /api/internal/workbook-backsync
            # endpoint accepts fan-out from apps/api and merges entity rows
            # into WorkbookModel.sections.
            - name: INTERNAL_BACKSYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: session-secrets
                  key: INTERNAL_BACKSYNC_TOKEN
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: GROQ_API_KEY
                  optional: true
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_ENDPOINT
                  optional: true
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_API_KEY
                  optional: true
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_DEPLOYMENT
                  optional: true
            # The toolkit chat and the Excel/booklet AI mapping prefer the FAST
            # deployment and only fall back to AZURE_OPENAI_DEPLOYMENT. Without
            # this, chat ran on the 400K-TPM deployment instead of the 100K one.
            - name: AZURE_OPENAI_FAST_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_FAST_DEPLOYMENT
                  optional: true
            - name: AZURE_OPENAI_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_API_VERSION
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SMTP_PASS
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SMTP_FROM
                  optional: true
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_BASE_URL
                  optional: true
            - name: ESG_PREVIEW_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ESG_PREVIEW_ALLOWLIST
                  optional: true
          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health
              port: 5001
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp-vol
          emptyDir:
            sizeLimit: 200Mi
