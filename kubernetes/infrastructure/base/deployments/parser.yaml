apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  labels:
    app: parser
    component: backend
    tier: parser
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: parser
  template:
    metadata:
      labels:
        app: parser
        component: backend
        tier: parser
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - parser
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: parser
          image: okiruproacrde4d539b.azurecr.io/okiru-pro/parser:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3200
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3200"
            # Payment gate. The code defaults this ON and PayFast checkout fails
            # closed, so without merchant keys every upload would dead-end at a
            # checkout that cannot settle. Remaining blocker before flipping to
            # "true": PAYFAST_MERCHANT_ID / _KEY / _PASSPHRASE as secrets here.
            # (Shared quote state — the other blocker — is now solved by
            # REDIS_URL below; the server refuses to boot if this is "true"
            # without it.)
            - name: PARSER_REQUIRE_PAYMENT
              value: "false"
            # Shared quote state across replicas. This Deployment runs 2 pods, so
            # a PayFast ITN can arrive at a pod that did not issue the quote; an
            # in-process store would never mark it paid and the payer would get
            # nothing. Same secret the api Deployment already uses.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            # REDIS_URL is credential-free (redis://redis:6379/0) but the server
            # runs with --requirepass, so the password must be supplied here.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            # Scanned documents. Five PDFs in the real Thandanani pack — including
            # the Share Certificate and Share Register that carry the whole
            # 25-point Ownership case — have no text layer at all. Document
            # Intelligence reads the scan and recovers table structure with it.
            # Unset = feature off; the local text layer is still used first.
            - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
                  optional: true
            - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_DOCUMENT_INTELLIGENCE_KEY
                  optional: true
            # Multimodal extraction (the expert's per-document prompts).
            # gpt-4o, not -mini: it is multimodal and these are real scanned
            # certificates and registers, not clean text. Matches the deployment
            # the api already uses.
            - name: AZURE_MODEL_DEPLOYMENT
              value: "gpt-4o"
            # 10 lanes × parallel chunks tripped the deployment's TPM limit on
            # big packs (429 storm); 6 keeps throughput without the wall.
            - name: PARSER_DOCUMENT_CONCURRENCY
              value: "6"
            # Durable copy of every uploaded evidence file (case-documents
            # container on the SAME backup storage account — no new
            # infrastructure). Optional: extraction proceeds unchanged if unset.
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-backup-credentials
                  key: AZURE_STORAGE_CONNECTION_STRING
                  optional: true
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_ENDPOINT
                  optional: true
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_API_KEY
                  optional: true
            # api-version must come from the secret, not the code default: the
            # default predates max_completion_tokens, which gpt-5-family
            # deployments require.
            - name: AZURE_OPENAI_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_API_VERSION
                  optional: true
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_DEPLOYMENT
                  optional: true
            - name: AZURE_OPENAI_FAST_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AZURE_OPENAI_FAST_DEPLOYMENT
                  optional: true
            # Neo4j is optional — the parser falls back to its in-memory
            # ontology (the canonical document types + verification matrix) when
            # no Neo4j URI is configured. These are wired only if the secret
            # exists, so document parsing works with or without a graph DB.
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: parser-credentials
                  key: NEO4J_URI
                  optional: true
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: parser-credentials
                  key: NEO4J_USER
                  optional: true
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parser-credentials
                  key: NEO4J_PASSWORD
                  optional: true
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              # 1Gi OOM-killed the pod (exit 137) while pricing a ~12-file
              # evidence pack: quote-files loads up to 6 PDFs through pdfjs
              # concurrently. 3Gi gives that path real headroom.
              memory: "3Gi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3200
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 3200
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health
              port: 3200
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp-vol
          emptyDir:
            sizeLimit: 200Mi
