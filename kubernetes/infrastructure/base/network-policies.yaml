# Network segmentation between workloads.
#
# Open item 3 of the security disclosure. Any pod in the namespace could open a
# connection to any other: a compromised parser could talk straight to MongoDB,
# and nothing in the cluster would object.
#
# LIVE as of 17 September 2026. The cluster ran --network-policy none until then,
# which meant the API server accepted NetworkPolicy objects, stored them, and
# enforced nothing — a cluster that looked segmented to anyone running
#  and was not. The engine is now .
#
# Enabling it reimages the node pool, so it was sequenced after the move to three
# zonal nodes and went through as a rolling change with a surge node and no
# downtime. On the single node it replaced it would have been a ten to twenty
# minute outage.
#
# PORTS ARE READ OFF THE LIVE SERVICES, NOT ASSUMED. The parser listens on 3200,
# not the 8080 this file first guessed; a default-deny with the wrong port here
# takes the document upload path down and says nothing about why.
#
# The default-deny rule is first on purpose: anything not explicitly allowed
# underneath it is refused.
---
# Nothing may reach any pod unless a rule below says so.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: okiru-pro
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Egress for the whole namespace.
#
# Egress and ingress are separate gates. The moment a pod is covered by ANY
# egress policy, everything not listed here is denied — which is how the first
# version of this rule, allowing 0.0.0.0/0 EXCEPT the cluster ranges, cut every
# service off from the database. Already-open connections kept serving, so the
# site looked healthy while nothing new could connect.
#
# In-namespace egress is allowed wholesale and the per-workload INGRESS rules
# below decide who may actually be reached. One place to read, rather than two
# that have to agree.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: okiru-pro
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS. Without this the whole namespace stops resolving names, and the
    # outage that follows always gets blamed on something else.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    # Everything the application legitimately reaches is outside the cluster:
    # Azure OpenAI, Document Intelligence, blob storage, SMTP, PayFast.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # Not the cloud metadata endpoint, which hands node identity
              # tokens to anything that can reach it.
              - 169.254.169.254/32
---
# The database is reachable only from the services that hold a connection
# string, plus the backup job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-access
  namespace: okiru-pro
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: web
        - podSelector:
            matchLabels:
              app: compute
        - podSelector:
            matchLabels:
              app: mongodb-backup
        # The restore drill reads nothing from production, but it is listed so
        # that a future drill that needs to compare against it is not a surprise.
        - podSelector:
            matchLabels:
              app: mongodb-restore-drill
      ports:
        - protocol: TCP
          port: 27017

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
  namespace: okiru-pro
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: web
        - podSelector:
            matchLabels:
              app: parser
      ports:
        - protocol: TCP
          port: 6379

---
# The public entry point. Only the ingress controller may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-access
  namespace: okiru-pro
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5001

---
# The API is not public. The ingress sends some paths to it directly, and the
# web proxy forwards others, so both are allowed — and nothing else is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-access
  namespace: okiru-pro
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 5000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: parser-access
  namespace: okiru-pro
spec:
  podSelector:
    matchLabels:
      app: parser
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: web
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 3200

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compute-access
  namespace: okiru-pro
spec:
  podSelector:
    matchLabels:
      app: compute
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: web
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000

# --- Verifying that any of this is real ------------------------------------
#
# `kubectl get networkpolicy` proves nothing; the objects exist either way.
# Check the engine, then check the behaviour:
#
#   az aks show -g okiru-pro-rg -n okiru-pro-aks \
#     --query networkProfile.networkPolicy -o tsv          # must not be "none"
#
#   # Should FAIL once the policies are enforced: the parser has no business
#   # opening a connection to the database.
#   kubectl exec -n okiru-pro deploy/parser -- \
#     timeout 5 sh -c 'echo > /dev/tcp/mongodb/27017' && echo "NOT ENFORCED" || echo "blocked"
#
#   # Should SUCCEED: the API is supposed to reach it.
#   kubectl exec -n okiru-pro deploy/api -- \
#     timeout 5 sh -c 'echo > /dev/tcp/mongodb/27017' && echo "allowed" || echo "BROKEN"
